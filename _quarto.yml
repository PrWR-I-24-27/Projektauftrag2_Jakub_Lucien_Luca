project:
  output-dir: _site
  type: book

book:
  title: "Auswirkungen des ÖV auf die Kosten des Wohnens"
  author: 
  - Lucien Deforge
  - Luca Pallagi
  - Jakub Pilecki
  
  date: "24.10.2025"
  chapters:
    - index.ipynb  

  downloads: [pdf]
  navbar: 
    right: 
      - icon: github
        href: "https://github.com/PrWR-I-24-27/Projektauftrag2_Jakub_Lucien_Luca"
        aria-label: GitHub
        target: "_blank"
    search: true

format:
  html:
    theme:
      - zephyr
    code-fold: true
    code-summary: "Show the code"
    code-download: false
    toc: true
    sidebar: false
    code-line-numbers: true
    code-overflow: wrap

    other-links:
      - text: Opendata 
        href: https://opendata.swiss/de
      - text: Vorläufige Disposition
        href: https://github.com/PrWR-I-24-27/Projektauftrag2_Jakub_Lucien_Luca/blob/dev/README.md

  pdf:
    documentclass: scrreprt
    fig-pos: 'H'
    fig-width: 6
    fig-asp: 0.618
    papersize: letter
    classoption: 
      - "DIV=11"
    number-sections: true
    toc: true
    top-level-division: chapter
    crossref:
      chapters: true
    header-includes:
      - "\\KOMAoption{captions}{tableheading}"
      - "\\usepackage{float}"
      - "\\floatplacement{figure}{H}" # Zwingt alle Bilder auf H
      - |
        \renewcommand{\topfraction}{.85}
        \renewcommand{\bottomfraction}{.7}
        \renewcommand{\textfraction}{.15}
        \renewcommand{\floatpagefraction}{.66}
    block-headings: true
    code-line-numbers: true
    break-at-whitespace: true
    echo: false

execute:
  freeze: auto
